name: Validate and deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the entire pipeline; never cancel a running production deployment.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      upload_pages_artifact: true

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated static artifact
        id: deployment
        uses: actions/deploy-pages@v4
